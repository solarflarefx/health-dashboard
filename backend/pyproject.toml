[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15.0",
    "fastapi>=0.135.3",
    "garminconnect>=0.3.2",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "ua-generator>=2.0.25",
    "uvicorn[standard]>=0.44.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
